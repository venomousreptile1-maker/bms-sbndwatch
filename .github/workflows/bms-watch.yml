# .github/workflows/bms-watch.yml
#
# Config is inline below - none of it is sensitive. The only thing that goes
# in Settings > Secrets and variables > Actions > Secrets is NTFY_TOPIC.

name: bms-watch

on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes (GitHub's minimum)
  workflow_dispatch:            # manual trigger button in the Actions tab

permissions:
  contents: write               # needed to commit the state file back

concurrency:
  group: bms-watch
  cancel-in-progress: false     # queue runs, never overlap

env:
  MOVIE_NAME:          "Spider-Man: Brand New Day"
  MOVIE_SLUG:          spider-man-brand-new-day
  EVENT_CODE:          ET00502600
  CITY_SLUG:           chennai
  CITY_CODE:           chen
  TARGET_DATES:        "20260730,20260731,20260801"
  WATCH_CODES:         "PCAN,AGSM,PVPZ"
  WATCH_VENUES:        ""
  ALERT_ON_MORE_SHOWS: "false"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 'cache: pip' omitted deliberately - it errors out unless a
          # requirements.txt / pyproject.toml exists in the repo.

      - name: Install deps
        run: pip install curl_cffi requests python-dotenv

      - name: Check BookMyShow
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bms_venue_watch.py --once

      - name: Persist state
        if: always()
        run: |
          test -f bms_venue_state.json || exit 0
          git config user.name  "bms-watch"
          git config user.email "actions@github.com"
          git add -f bms_venue_state.json
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "could not push state after 3 attempts"
          exit 1
